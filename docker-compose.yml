services:
  ml_service:
    build:
      context: ./backend
      dockerfile: ml_service/Dockerfile
    env_file:
      - ./backend/config.env
    environment:
      PORT: 5001
      PYTHONUNBUFFERED: 1
    ports:
      - "5001:5001"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/config.env
    environment:
      NODE_ENV: production
      PORT: 5000
      PYTHON_ML_SERVICE_URL: http://ml_service:5001
      ML_SERVICE_URL: http://ml_service:5001
    depends_on:
      - ml_service
    ports:
      - "5000:5000"
